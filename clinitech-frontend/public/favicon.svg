<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Degradado principal con la paleta de identidad médica CliniTech -->
    <linearGradient id="clinitech-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004d70" />
      <stop offset="45%" stop-color="#006591" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Sombra suave para dar volumen al ícono en la pestaña del navegador -->
    <filter id="card-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25" />
    </filter>

    <filter id="cross-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#002b40" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Contenedor squircle con esquinas redondeadas -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#clinitech-bg)" filter="url(#card-shadow)" />

  <!-- Borde interior sutil de iluminación vítrea -->
  <rect x="7" y="7" width="114" height="114" rx="27" fill="none" stroke="rgba(255, 255, 255, 0.24)" stroke-width="2" />

  <!-- Cruz médica estilizada en blanco de alto contraste -->
  <g filter="url(#cross-shadow)">
    <!-- Barra vertical -->
    <rect x="50" y="22" width="28" height="84" rx="8" fill="#ffffff" />
    <!-- Barra horizontal -->
    <rect x="22" y="50" width="84" height="28" rx="8" fill="#ffffff" />
  </g>

  <!-- Pulso digital ECG integrado (Simbolismo Salud + Tecnología) -->
  <path
    d="M 28 64 L 45 64 L 53 45 L 64 83 L 75 51 L 83 64 L 100 64"
    fill="none"
    stroke="#006591"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Puntos nodales tecnológicos de inicio y fin de señal -->
  <circle cx="28" cy="64" r="3.5" fill="#0284c7" />
  <circle cx="100" cy="64" r="3.5" fill="#38bdf8" />
</svg>