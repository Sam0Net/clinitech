spring.application.name=clinitech-backend
server.error.include-message=never

# PostgreSQL credentials must be injected through the environment; never commit them.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/clinitech}
spring.datasource.username=${DB_USERNAME:clinitech}
spring.datasource.password=${DB_PASSWORD:clinitech123}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

# Must be a Base64-encoded key of at least 32 bytes. Generate one with:
# openssl rand -base64 32
app.jwt.secret=${JWT_SECRET:dGhpcy1pcy1hLXNlY3JldC1qd3Qta2V5LWNsaW5pdGVjaC11dHAtMjAyNi1iYXNlNjQ=}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.bootstrap.admin.username=${APP_BOOTSTRAP_ADMIN_USERNAME:}
# Bypass de autenticación temporal para evaluación del 30% (obviar login según requerimiento docente)
# Cambiar a false en la siguiente entrega para reactivar la seguridad estricta obligatoria
app.security.dev-bypass=true
